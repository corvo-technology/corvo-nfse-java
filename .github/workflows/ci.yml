name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B verify

  contract:
    runs-on: ubuntu-latest
    name: Contract (live, optional)
    # Only runs when live credentials are configured; skipped otherwise.
    if: ${{ github.event_name == 'push' }}
    env:
      CORVO_API_KEY: ${{ secrets.CORVO_API_KEY }}
      CORVO_BASE_URL: ${{ secrets.CORVO_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run contract tests against live instance
        run: mvn -B -Dtest=ContractTest verify
